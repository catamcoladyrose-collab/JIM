
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play Lucky Number</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>🎮 Lucky Number Game</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="game.html">Play Game</a>
        </nav>
    </header>

    <main>
        <section class="game-card">
            <div class="emoji">🎯</div>

            <h2>Guess the Secret Number!</h2>
            <p>Choose a number from 1 to 10.</p>
            <p>You have three tries to win!</p>

            <input type="number" id="guess"
                   min="1" max="10"
                   placeholder="Enter 1–10">

            <button onclick="checkGuess()">Guess</button>
            <button class="reset" onclick="resetGame()">Play Again</button>

            <p id="message">Good luck!</p>
            <p>Tries left: <strong id="tries">3</strong></p>

            <a href="index.html">← Back to Home</a>
        </section>
    </main>

    <footer>
        <p>© 2026 Lucky Number Game</p>
    </footer>

    <script>
        let secretNumber = Math.floor(Math.random() * 10) + 1;
        let triesLeft = 3;
        let gameOver = false;

        function checkGuess() {
            const input = document.getElementById("guess");
            const message = document.getElementById("message");
            const guess = Number(input.value);

            if (gameOver) {
                message.textContent =
                    "Click Play Again to start a new game.";
                return;
            }

            if (
                input.value === "" ||
                !Number.isInteger(guess) ||
                guess < 1 ||
                guess > 10
            ) {
                message.textContent =
                    "Please enter a number from 1 to 10.";
                return;
            }

            triesLeft--;

            document.getElementById("tries").textContent =
                triesLeft;

            if (guess === secretNumber) {
                message.textContent = "🎉 Correct! You win!";
                gameOver = true;
            } else if (triesLeft === 0) {
                message.textContent =
                    "Game over! The number was " + secretNumber + ".";
                gameOver = true;
            } else if (guess < secretNumber) {
                message.textContent =
                    "Too low! Try a higher number.";
            } else {
                message.textContent =
                    "Too high! Try a lower number.";
            }
        }

        function resetGame() {
            secretNumber = Math.floor(Math.random() * 10) + 1;
            triesLeft = 3;
            gameOver = false;

            document.getElementById("tries").textContent = 3;
            document.getElementById("message").textContent =
                "New game! Good luck!";
            document.getElementById("guess").value = "";
        }
    </script>

</body>
</html>
